name: Fuzz campaign

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign size
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - weekly
  schedule:
    - cron: "17 4 * * 0,2-6"
    - cron: "47 4 * * 1"

permissions:
  contents: read

concurrency:
  group: fuzz-campaign-${{ github.event.schedule || inputs.campaign || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Choose campaign budget
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.settings.outputs.kind }}
      retention_days: ${{ steps.settings.outputs.retention_days }}
      stamp: ${{ steps.settings.outputs.stamp }}
    steps:
      - id: settings
        name: Resolve schedule or manual choice
        shell: bash
        run: |
          kind="${{ inputs.campaign }}"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "47 4 * * 1" ]]; then
              kind=weekly
            else
              kind=nightly
            fi
          fi
          retention=30
          if [[ "$kind" == "weekly" ]]; then
            retention=90
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "retention_days=$retention" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  state:
    name: ${{ needs.prepare.outputs.kind }} state / Emacs ${{ matrix.emacs-version }} / shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        emacs-version: [29.1, 30.1, snapshot]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: fzf-async

      - uses: actions/checkout@v4
        with:
          repository: dangduc/fzf-native
          ref: "2.7"
          path: fzf-native

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Replay fixed cases and run a deterministic state shard
        shell: bash
        env:
          FZFA_FUZZ_ARTIFACT_FILE: ${{ runner.temp }}/fzfa-state-${{ matrix.emacs-version }}-${{ matrix.shard }}.sexp
        run: |
          cases=1250
          steps=100
          if [[ "${{ needs.prepare.outputs.kind }}" == "weekly" ]]; then
            cases=5000
            steps=160
          fi
          seed=$(printf '%s\n' "${{ needs.prepare.outputs.stamp }}:state:${{ matrix.emacs-version }}:${{ matrix.shard }}" | cksum | cut -d ' ' -f 1)
          export FZFA_FUZZ_SEED="$seed"
          make -C fzf-async/fuzz replay state \
            CASES="$cases" STEPS="$steps"

      - name: Upload state failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fzfa-${{ needs.prepare.outputs.kind }}-state-${{ matrix.emacs-version }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/fzfa-state-${{ matrix.emacs-version }}-${{ matrix.shard }}.sexp
          if-no-files-found: ignore
          retention-days: ${{ needs.prepare.outputs.retention_days }}

  native:
    name: ${{ needs.prepare.outputs.kind }} native / shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: fzf-async

      - uses: actions/checkout@v4
        with:
          repository: dangduc/fzf-native
          ref: "2.7"
          path: fzf-native

      - uses: jcs090218/setup-emacs@master
        with:
          version: 30.1

      - name: Install ugrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ugrep

      - name: Run deterministic producer and scheduler shards
        shell: bash
        env:
          FZFA_FUZZ_ARTIFACT_FILE: ${{ runner.temp }}/fzfa-native-${{ matrix.shard }}.sexp
        run: |
          cases=250
          schedule_cases=50
          if [[ "${{ needs.prepare.outputs.kind }}" == "weekly" ]]; then
            cases=1000
            schedule_cases=200
          fi
          seed=$(printf '%s\n' "${{ needs.prepare.outputs.stamp }}:native:${{ matrix.shard }}" | cksum | cut -d ' ' -f 1)
          export FZFA_FUZZ_SEED="$seed"
          make -C fzf-async/fuzz partition differential producer \
            CASES="$cases"
          make -C fzf-async/fuzz schedule CASES="$schedule_cases"
          make -C fzf-async/fuzz tools CASES="$cases"

      - name: Upload native failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fzfa-${{ needs.prepare.outputs.kind }}-native-${{ matrix.shard }}
          path: ${{ runner.temp }}/fzfa-native-${{ matrix.shard }}.sexp
          if-no-files-found: ignore
          retention-days: ${{ needs.prepare.outputs.retention_days }}

  live:
    name: ${{ needs.prepare.outputs.kind }} live icomplete / Emacs ${{ matrix.emacs-version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        emacs-version: [29.1, 30.1, snapshot]
    steps:
      - uses: actions/checkout@v4
        with:
          path: fzf-async

      - uses: actions/checkout@v4
        with:
          repository: dangduc/fzf-native
          ref: "2.7"
          path: fzf-native

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Exercise a real minibuffer
        shell: bash
        env:
          TERM: xterm-256color
          FZFA_FUZZ_RESULT_FILE: ${{ runner.temp }}/fzfa-live-${{ matrix.emacs-version }}.txt
          FZFA_FUZZ_ARTIFACT_FILE: ${{ runner.temp }}/fzfa-live-${{ matrix.emacs-version }}.sexp
        run: |
          cases=40
          if [[ "${{ needs.prepare.outputs.kind }}" == "weekly" ]]; then
            cases=100
          fi
          seed=$(printf '%s\n' "${{ needs.prepare.outputs.stamp }}:live:${{ matrix.emacs-version }}" | cksum | cut -d ' ' -f 1)
          export FZFA_FUZZ_SEED="$seed"
          set +e
          script --quiet --return --command \
            "make -C fzf-async/fuzz live LIVE_CASES=$cases LIVE_EMACS_FLAGS=-nw" \
            /dev/null
          status=$?
          set -e
          if [[ -f "$FZFA_FUZZ_RESULT_FILE" ]]; then
            cat "$FZFA_FUZZ_RESULT_FILE"
          fi
          exit "$status"

      - name: Upload live failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fzfa-${{ needs.prepare.outputs.kind }}-live-${{ matrix.emacs-version }}
          path: ${{ runner.temp }}/fzfa-live-${{ matrix.emacs-version }}.sexp
          if-no-files-found: ignore
          retention-days: ${{ needs.prepare.outputs.retention_days }}

  live-frontends:
    name: ${{ needs.prepare.outputs.kind }} live ${{ matrix.frontend }} / Emacs ${{ matrix.emacs-version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: default
            emacs-version: snapshot
          - frontend: vertico
            emacs-version: snapshot
          - frontend: helm
            emacs-version: 30.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: fzf-async

      - uses: actions/checkout@v4
        with:
          repository: dangduc/fzf-native
          ref: "2.7"
          path: fzf-native

      - uses: actions/checkout@v4
        if: matrix.frontend == 'vertico'
        with:
          repository: minad/vertico
          path: fzf-async/fuzz-deps/vertico

      - uses: actions/checkout@v4
        if: matrix.frontend == 'helm'
        with:
          repository: emacs-helm/helm
          path: fzf-async/fuzz-deps/helm

      - uses: actions/checkout@v4
        if: matrix.frontend == 'helm'
        with:
          repository: jwiegley/emacs-async
          path: fzf-async/fuzz-deps/async

      - uses: actions/checkout@v4
        if: matrix.frontend == 'helm'
        with:
          repository: thierryvolpiatto/wfnames
          path: fzf-async/fuzz-deps/wfnames

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Exercise real frontend updates and selection
        shell: bash
        env:
          TERM: xterm-256color
          FZFA_FUZZ_RESULT_FILE: ${{ runner.temp }}/fzfa-${{ matrix.frontend }}.txt
          FZFA_FUZZ_ARTIFACT_FILE: ${{ runner.temp }}/fzfa-${{ matrix.frontend }}.sexp
        run: |
          cases=20
          if [[ "${{ needs.prepare.outputs.kind }}" == "weekly" ]]; then
            cases=50
          fi
          seed=$(printf '%s\n' "${{ needs.prepare.outputs.stamp }}:frontend:${{ matrix.frontend }}" | cksum | cut -d ' ' -f 1)
          export FZFA_FUZZ_SEED="$seed"
          load_dirs=""
          case "${{ matrix.frontend }}" in
            vertico) load_dirs="../fuzz-deps/vertico" ;;
            helm) load_dirs="../fuzz-deps/helm ../fuzz-deps/async ../fuzz-deps/wfnames" ;;
          esac
          set +e
          script --quiet --return --command \
            "make -C fzf-async/fuzz live-frontends FRONTEND=${{ matrix.frontend }} LIVE_CASES=$cases LIVE_EMACS_FLAGS=-nw LIVE_FRONTEND_DIRS='$load_dirs'" \
            /dev/null
          status=$?
          set -e
          if [[ -f "$FZFA_FUZZ_RESULT_FILE" ]]; then
            cat "$FZFA_FUZZ_RESULT_FILE"
          fi
          exit "$status"

      - name: Upload frontend failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fzfa-${{ needs.prepare.outputs.kind }}-live-${{ matrix.frontend }}
          path: ${{ runner.temp }}/fzfa-${{ matrix.frontend }}.sexp
          if-no-files-found: ignore
          retention-days: ${{ needs.prepare.outputs.retention_days }}
